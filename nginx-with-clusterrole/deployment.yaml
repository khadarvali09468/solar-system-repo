apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginxd
  name: nginxd
  namespace: nginx-nov
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginxd
  strategy: {}
  template:
    metadata:
      labels:
        app: nginxd
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
status: {}

