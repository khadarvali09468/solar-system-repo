apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: solar-system-bs
  name: solar-system-bs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solar-system-bs
  strategy: {}
  template:
    metadata:
      labels:
        app: solar-system-bs
    spec:
      containers:
      - image: siddharth67/solar-system:v6
        name: solar-system-bs
        imagePullPolicy: Always
        ports: 
        - containerPort: 80
